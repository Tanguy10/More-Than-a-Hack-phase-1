[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-possession"
version = "1.0.0"
description = "Football team possession inference from tactical tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "numba==0.68.0",
    "pandas==3.1.0",
    "kloppy==3.19.1",
    "lxml==6.1.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
possession-infer = "possession.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"possession._official" = ["LICENSE", "provenance.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/possession/_official"]
